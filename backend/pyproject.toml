[project]
name = "digitalsofts-ai-assistant"
version = "0.1.0"
description = "Enterprise AI Knowledge & Action Assistant for Digitalsofts"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    # Database
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.0",
    "alembic>=1.13.0",
    "pgvector>=0.3.0",
    # Auth
    "pyjwt>=2.8.0",
    "bcrypt>=4.1.0",
    "passlib[bcrypt]>=1.7.4",
    # AI / LLM
    "litellm>=1.40.0",
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    # Embeddings (local)
    "sentence-transformers>=3.0.0",
    # Reranking
    "flashrank>=0.2.0",
    # Document parsing
    "pymupdf>=1.24.0",
    "beautifulsoup4>=4.12.0",
    "markdown-it-py>=3.0.0",
    # Task queue
    "arq>=0.26.0",
    "redis>=5.0.0",
    # Observability
    "langfuse>=2.40.0",
    "prometheus-client>=0.20.0",
    "structlog>=24.1.0",
    # Evaluation
    "ragas>=0.2.0",
    # Config
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "email-validator>=2.0.0",
    "python-dotenv>=1.0.0",
    # HTTP client
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "bandit>=1.7.0",
    "pip-audit>=2.7.0",
    "factory-boy>=3.3.0",
    "aiosqlite>=0.20.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "SIM", "TCH"]
ignore = ["S101", "S104"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
