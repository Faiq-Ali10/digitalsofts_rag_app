name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install ruff
        run: pip install ruff
      - name: Run ruff check
        run: ruff check backend/
      - name: Run ruff format check
        run: ruff format --check backend/

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          cd backend
          pip install -e ".[dev]"
      - name: Run mypy
        run: |
          cd backend
          mypy app/ --ignore-missing-imports
        continue-on-error: true  # Non-blocking for initial development

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          cd backend
          pip install -e ".[dev]"
      - name: Run tests
        run: |
          cd backend
          pytest tests/unit/ -v --tb=short --cov=app --cov-report=xml
        env:
          APP_ENV: development
          JWT_SECRET_KEY: test-secret-key
          DATABASE_URL: sqlite+aiosqlite:///test.db
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage.xml

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install tools
        run: pip install bandit pip-audit
      - name: Run bandit
        run: bandit -r backend/app/ -c pyproject.toml --skip B101
        continue-on-error: true
      - name: Run pip-audit
        run: |
          cd backend
          pip install -e .
          pip-audit
        continue-on-error: true

  build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t digitalsofts-backend ./backend
      - name: Verify image
        run: docker run --rm digitalsofts-backend python -c "import app; print('OK')"
